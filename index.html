<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleGrab Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>⚡ TeleGrab Pro</h1>
            <div>
                <button id="settingsToggle" aria-label="Settings">⚙️</button>
                <button id="themeToggle" aria-label="Toggle theme">🌙</button>
            </div>
        </header>

        <div id="settingsPanel" style="display:none; background:#0e131c; padding:1rem; border-radius:16px; margin-bottom:1.5rem; border:1px solid #2a3344;">
            <label>📁 Download folder: <span id="folderDisplay">Default (Downloads)</span></label>
            <button id="pickFolderBtn">Choose Folder</button>
            <button id="resetFolderBtn">Reset</button>
            <hr style="border-color:#2a3344; margin:0.8rem 0;">
            <label>🔑 Telegram API (optional):</label>
            <input type="text" id="apiId" placeholder="API ID" style="width:45%; margin-right:0.5rem;">
            <input type="text" id="apiHash" placeholder="API Hash" style="width:45%;">
            <p style="font-size:0.75rem; color:#6a7a8e; margin-top:0.3rem;">Leave blank to use CDN fallback.</p>
        </div>

        <main>
            <section class="input-section">
                <div class="url-input-group">
                    <input type="text" id="fileUrl" placeholder="Paste Telegram file URL, message ID, or chat ID..." autofocus>
                    <button id="grabBtn">▶ Grab</button>
                </div>
                <div class="drop-zone" id="dropZone">
                    <p>📁 Drag & drop a .txt file with URLs (one per line)</p>
                </div>
            </section>

            <section class="bulk-section">
                <textarea id="bulkUrls" rows="3" placeholder="Or paste multiple URLs, chat IDs, or message IDs here (one per line)"></textarea>
                <button id="bulkGrabBtn">📥 Grab All</button>
            </section>

            <section class="progress-section">
                <div id="progressContainer" style="display:none;">
                    <div class="progress-bar-bg">
                        <div id="progressFill" class="progress-fill" style="width:0%;"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progressPercent">0%</span>
                        <span id="progressSize">0 MB / 0 MB</span>
                        <span id="progressSpeed">0 MB/s</span>
                    </div>
                    <button id="pauseBtn" style="display:none;">⏸ Pause</button>
                    <button id="resumeBtn" style="display:none;">▶ Resume</button>
                </div>
                <div id="statusLog" class="status-log"></div>
            </section>

            <section class="hash-section">
                <div id="hashDisplay" style="display:none;">
                    <strong>SHA256:</strong> <span id="hashValue"></span>
                    <button id="copyHashBtn">📋 Copy</button>
                </div>
            </section>
        </main>

        <footer>
            <span>🔒 Private & local — no data leaves your browser</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
                            </html>
